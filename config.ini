[server]
port = 8080
threads = 8
web_root = ./web

[mysql]
host = 127.0.0.1
port = 3306
user = root
password = root
database = demo_player
pool_size = 10

[api]
# 网易云音乐 API 地址 (NeteaseCloudMusicApi 服务地址)
netease_api = http://10.95.6.100:3000
timeout_sec = 5

[cache]
# 内存 LRU 缓存最大歌词及元数据条目数 (避免占用内存)
lru_capacity = 1000
# 验证码有效期 (秒)
code_ttl = 300
# Token 有效期 (秒)
token_ttl = 86400
# Refresh Token 有效期 (秒)
refresh_token_ttl = 604800
